<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">CoffeeShopManager - Sơ đồ kiến trúc</text>
  <text x="600" y="84" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">Kiến trúc phân tầng và luồng trao đổi dữ liệu</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="90" y="160" width="220" height="120" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="200" y="205" font-size="23" font-weight="700" fill="#1e3a8a">Web</text><text x="200" y="238" font-size="18" fill="#1e3a8a">Blazor Server</text>
    <rect x="350" y="160" width="220" height="120" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="460" y="205" font-size="23" font-weight="700" fill="#14532d">API</text><text x="460" y="238" font-size="18" fill="#14532d">ASP.NET Core</text>
    <rect x="610" y="160" width="220" height="120" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="720" y="205" font-size="23" font-weight="700" fill="#78350f">BLL</text><text x="720" y="238" font-size="18" fill="#78350f">Services + DTOs</text>
    <rect x="870" y="160" width="220" height="120" rx="16" fill="#fce7f3" stroke="#db2777" stroke-width="3"/>
    <text x="980" y="205" font-size="23" font-weight="700" fill="#831843">DAL</text><text x="980" y="238" font-size="18" fill="#831843">EF Core + Repository</text>
    <line x1="310" y1="220" x2="350" y2="220" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/><line x1="570" y1="220" x2="610" y2="220" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/><line x1="830" y1="220" x2="870" y2="220" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="430" y="430" width="340" height="130" rx="16" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/>
    <text x="600" y="480" font-size="25" font-weight="700" fill="#312e81">SQLite Database</text><text x="600" y="518" font-size="18" fill="#312e81">CoffeeShopDB.db</text>
    <line x1="980" y1="280" x2="700" y2="430" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="600" y="640" font-size="18" fill="#475569">Bàn • Món • Hóa đơn • Chi tiết hóa đơn • Nhân viên • Khách hàng</text>
